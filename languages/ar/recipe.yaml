# Arabic tokenizer recipe (Arab script). Training text staged by
# scripts/stage_corpus.py from FineWeb-2 [arb_Arab] + Wikipedia [20231101.ar]; eval on the
# ungated FLORES-200 arb_Arab/eng_Latn pair (task data:flores).

language:
  code: ar
  name: Arabic
  scripts: [Arab]

train_corpora:
  - source: local
    id: ${TOKENIZER_DATA_DIR}/ar/train/fineweb2.txt
    config: arb_Arab # HuggingFaceFW/fineweb-2
    split: train
    weight: 0.7
    domain: web
  - source: local
    id: ${TOKENIZER_DATA_DIR}/ar/train/wiki.txt
    config: 20231101.ar # wikimedia/wikipedia
    split: train
    weight: 0.3
    domain: wiki

eval_corpora:
  - source: local
    id: ${TOKENIZER_DATA_DIR}/flores200/flores200_dataset/devtest/arb_Arab.devtest
    config: arb_Arab
    split: devtest
    weight: 1.0
    domain: general
  - source: local
    id: ${TOKENIZER_DATA_DIR}/flores200/flores200_dataset/devtest/eng_Latn.devtest
    config: eng_Latn
    split: devtest
    weight: 1.0
    domain: general

candidates:
  - name: ar-bpe-32k
    algorithm: bpe
    vocab_size: 32000
    byte_fallback: true
    normalization: NFC

targets:
  max_fertility_vs_english: 1.0
  max_quality_drop_pct: 1.0

baselines:
  - gpt2
  - meta-llama/Llama-3.1-8B
  - mistralai/Mistral-7B-v0.1
  - Qwen/Qwen2.5-7B
  - deepseek-ai/DeepSeek-V3
