# Polish tokenizer recipe.
#
# NOTE: this is the initial draft used to bootstrap the repo. Corpora choices,
# candidate set, and targets are refined by the BMAD planning artifacts
# (_bmad-output/planning-artifacts) and the benchmark iterations. The trained
# tokenizer binaries are build artifacts on the Nextcloud data store; this file
# is the reproducible source of truth.

language:
  code: pl
  name: Polish
  scripts: [Latn]

# Polish is a fusional, highly inflected Slavic language: rich case/number/
# gender morphology and productive diacritics (ą ć ę ł ń ó ś ź ż). Universal
# tokenizers over-segment it (~1.5-3.2 tokens/word vs ~1.3 for English), which
# is the root of the "Polish costs ~2x the tokens" penalty this repo targets.

train_corpora:
  - source: hf
    id: oscar-corpus/OSCAR-2301
    config: pl
    split: train
    weight: 0.5
    domain: web
  - source: hf
    id: allenai/c4
    config: pl
    split: train
    weight: 0.2
    domain: web
  - source: hf
    id: wikimedia/wikipedia
    config: 20231101.pl
    split: train
    weight: 0.2
    domain: wiki
  # Technical/code-adjacent Polish (docs, StackExchange-pl, legal) to support a
  # possible technical-vs-general routing experiment.
  - source: hf
    id: speakleash/pl-legal-texts # placeholder id; confirm during acquisition
    config: default
    split: train
    weight: 0.1
    domain: legal

# Held out for benchmarking fertility + quality. FLORES-200 gives sentence-
# aligned PL/EN pairs, so fertility is measured on IDENTICAL content — the
# fair way to state "Polish costs N tokens for the same sentence as English".
eval_corpora:
  - source: hf
    id: facebook/flores # dev/devtest, pl vs en aligned
    config: pol_Latn
    split: devtest
    weight: 1.0
    domain: general
  - source: hf
    id: wikimedia/wikipedia
    config: 20231101.pl
    split: test
    weight: 1.0
    domain: wiki

candidates:
  - name: pl-bpe-32k
    algorithm: bpe
    vocab_size: 32000
    byte_fallback: true
    normalization: NFC
  - name: pl-unigram-32k
    algorithm: unigram
    vocab_size: 32000
    byte_fallback: true
    normalization: NFC
  - name: pl-superbpe-32k
    algorithm: superbpe # cross-word "superword" tokens (arXiv:2503.13423)
    vocab_size: 32000
    byte_fallback: true
    normalization: NFC

targets:
  # Bring Polish fertility to <= the English baseline on aligned FLORES content.
  max_fertility_vs_english: 1.0
  # Transplanted onto a model, downstream quality must not drop more than this.
  max_quality_drop_pct: 1.0

# The universal tokenizers we want to beat on Polish fertility.
baselines:
  - gpt2
  - meta-llama/Llama-3.1-8B
  - mistralai/Mistral-7B-v0.1
  - Qwen/Qwen2.5-7B
  - google/gemma-2-9b
  - speakleash/Bielik-11B-v3 # the Polish-optimized reference (APT4 tokenizer)
